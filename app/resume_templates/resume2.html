            display: grid;
            grid-template-columns: 1fr 1fr;

        }
        .individual-contributor-list .experience-item {
            border-left: 2px solid #eee;
            padding-left: 8px;
            margin-bottom: 0;
            background: none;
            font-size: 0.97em;
            color: #666;
        }
        .individual-contributor-list h3 {
            font-size: 1em;
            margin: 0 0 2px 0;
            color: #888;
        }
        .individual-contributor-list p,
        .individual-contributor-list ul {
            margin: 0 0 2px 0;
        }
        .individual-contributor-list ul {
            padding-left: 16px;
            margin-bottom: 0;
        }
        @media (max-width: 700px) {
            .individual-contributor-list {
